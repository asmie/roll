name: CMake

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # The README advertises Linux, Windows and macOS, and the MSVC /W4 path in
  # CMakeLists.txt was never compiled by CI. Build all three so the claim is
  # actually tested.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
          # Clang before 19 reports __cpp_concepts as 201907, and libstdc++
          # gates <expected> on 202002, so Clang 18 + libstdc++ compiles as
          # C++23 with no std::expected. Build against libc++, which has it.
          - name: linux-clang-libcxx
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cxxflags: -stdlib=libc++
            apt: libc++-dev libc++abi-dev
          - name: macos-appleclang
            os: macos-latest
          - name: windows-msvc
            os: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install apt packages
      if: matrix.apt != ''
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

    - name: Install OpenSSL (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install openssl@3
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

    - name: Configure
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        CXXFLAGS: ${{ matrix.cxxflags }}
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure

  # RH_ENABLE_ASAN existed but nothing ever exercised it.
  sanitizers:
    name: linux-asan-ubsan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      env:
        CC: gcc-13
        CXX: g++-13
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DRH_ENABLE_ASAN=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      working-directory: build
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --output-on-failure

  # A consumer who only wants the binary should not need GoogleTest or network
  # access at configure time, and the install rule should produce a usable tool.
  packaging:
    name: linux-no-tests-install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure without tests
      env:
        CC: gcc-13
        CXX: g++-13
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

    - name: Confirm GoogleTest was not fetched
      run: |
        if [ -d build/_deps/googletest-src ]; then
          echo "GoogleTest was fetched despite BUILD_TESTING=OFF" >&2
          exit 1
        fi

    - name: Build and install
      run: |
        cmake --build build --parallel
        cmake --install build --prefix "$PWD/stage"

    - name: Smoke-test the installed binary
      run: |
        "$PWD/stage/bin/rolling_hash" --version
        printf 'hello\nold line\n' > old.txt
        printf 'hello\nnew line\n' > new.txt
        "$PWD/stage/bin/rolling_hash" create old.txt new.txt changes.delta
        "$PWD/stage/bin/rolling_hash" apply old.txt changes.delta rebuilt.txt
        cmp new.txt rebuilt.txt
        "$PWD/stage/bin/rolling_hash" view changes.delta > /dev/null

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Advisory only: the tree predates .clang-format and mixes tabs with
    # four-space indentation, so a repo-wide check would fail on untouched code.
    # This reports what the config would change without gating the build.
    - name: Report formatting differences
      continue-on-error: true
      run: |
        clang-format --version
        git ls-files '*.cpp' '*.hpp' '*.h' | xargs clang-format --dry-run 2>&1 | head -100
